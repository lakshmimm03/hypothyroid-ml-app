<!DOCTYPE html>
<html>
<head>
    <title>Hypothyroid Prediction</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #4e73df, #1cc88a);
        }
        .card {
            border-radius: 15px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">🩺 ThyroPredict</a>
    <div class="ms-auto">
      <a class="btn btn-light btn-sm me-2" href="/history">History</a>
      <a class="btn btn-outline-light btn-sm" href="/logout">Logout</a>
    </div>
  </div>
</nav>

<!-- FORM SECTION -->
<div class="container mt-5">
  <div class="card shadow-lg p-4">
    <h3 class="text-center mb-4">Hypothyroid Prediction</h3>

    <form action="/predict" method="POST">
      <div class="row g-3">

        <div class="col-md-6">
          <label class="form-label">Age</label>
          <input type="number" step="any" name="age" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">TSH</label>
          <input type="number" step="any" name="TSH" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">T3</label>
          <input type="number" step="any" name="T3" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">TT4</label>
          <input type="number" step="any" name="TT4" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">T4U</label>
          <input type="number" step="any" name="T4U" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">FTI</label>
          <input type="number" step="any" name="FTI" class="form-control" required>
        </div>

      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary px-4">
            Predict
        </button>
      </div>

    </form>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
